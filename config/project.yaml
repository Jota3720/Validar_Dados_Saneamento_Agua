database_config: config/database.yaml
layers_mapping: config/layers_mapping.yaml
tolerances: config/tolerancias.yaml
rules_catalog: config/rules_catalog.yaml
outputs_root: outputs
domain: SANEAMENTO
code_prefix: SAN
extraction:
  # Usar null para correr sobre todas as entidades.
  # Para testes iniciais contra Oracle, podes colocar por exemplo 500.
  row_limit: null
exports:
  driver: GPKG
  overwrite: true
validation:
  require_projected_crs: true
  stop_on_crs_error: true
  active_status_values:
    - ATIVO
    - ACTIVO
    - EM SERVICO
    - EM SERVIÇO
  inactive_status_values:
    - INATIVO
    - INACTIVO
    - ABANDONADO
    - DESATIVADO
    - DESACTIVADO
